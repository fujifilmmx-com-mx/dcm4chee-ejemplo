# application.yml - Configuración Segura Inmediata
# Reemplaza configuración hardcodeada en DicomProcessor.java

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  application:
    name: dcm4chee-ejemplo

# Configuración DICOM externalizada (CRÍTICO)
dicom:
  local:
    ip: ${DICOM_LOCAL_IP:127.0.0.1}
    port: ${DICOM_LOCAL_PORT:1105}
    ae-title: ${DICOM_LOCAL_AE:DCM4CHEE3}
    storage-path: ${DICOM_STORAGE_PATH:/opt/dicom/images}
  remote:
    ip: ${DICOM_REMOTE_IP:192.168.1.100}
    port: ${DICOM_REMOTE_PORT:104}
    ae-title: ${DICOM_REMOTE_AE:SYN7DCM}
  tools:
    storescp-path: ${STORESCP_PATH:/opt/dcmtk/bin/storescp}
  folders:
    prefix: ${FOLDER_PREFIX:DCM}

# Configuración de logging seguro (CRÍTICO)
logging:
  level:
    com.test.dicom_test: INFO
    org.dcm4che3: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/dicom-app.log
    max-size: 100MB
    max-history: 30

# Configuración de seguridad (ALTO)
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: strict

# Configuración de management/monitoring (MEDIO)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

---
# Perfil de desarrollo
spring:
  profiles: development

dicom:
  local:
    ip: 127.0.0.1
  remote:
    ip: 172.16.70.67

logging:
  level:
    com.test.dicom_test: DEBUG

server:
  servlet:
    session:
      cookie:
        secure: false

---
# Perfil de producción
spring:
  profiles: production

dicom:
  local:
    ip: ${PROD_LOCAL_IP}
  remote:
    ip: ${PROD_REMOTE_IP}

logging:
  level:
    org.springframework: WARN
    com.test.dicom_test: INFO

server:
  servlet:
    session:
      cookie:
        secure: true